[project]
name = "project4-ems"
version = "0.1.0"
description = "Сервис управления email-рассылками на Django"
authors = [
    {name = "Tw1nSen"}
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.0,<9.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
