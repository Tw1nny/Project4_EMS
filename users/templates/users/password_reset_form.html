{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-2">Восстановление пароля</h1>
    <p class="text-muted">Укажите email, с которым вы регистрировались, — мы пришлём ссылку для смены пароля.</p>
    <form method="post" novalidate class="card card-body">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">Отправить ссылку</button>
    </form>
    
  </div></div>
{% endblock %}
