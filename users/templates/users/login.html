{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-2">Вход</h1>
    <p class="text-muted">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
    <form method="post" novalidate class="card card-body">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p class="mt-3"><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
  </div></div>
{% endblock %}
