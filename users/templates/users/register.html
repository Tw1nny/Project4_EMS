{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-2">Регистрация</h1>
    <p class="text-muted">Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
    <form method="post" novalidate class="card card-body">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
    <p class="form-text mt-2">После регистрации на вашу почту придёт письмо со ссылкой для подтверждения email.</p>
  </div></div>
{% endblock %}
